name: Build RDR2 Trainer

on:
  push:
    branches:
      - rdr2-trainer-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout trainer branch
        uses: actions/checkout@v4

      - name: Fetch ScriptHook RDR2 SDK files
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/RaonHook/RDR2-Menu-Base.git _rdr2sdk
          if (!(Test-Path "_rdr2sdk/RDR2_Menu_Base/inc/natives.h")) { throw "RDR2 SDK headers not found" }
          if (!(Test-Path "_rdr2sdk/RDR2_Menu_Base/lib/ScriptHookRDR2.lib")) { throw "ScriptHookRDR2.lib not found" }

      - name: Build ASI with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "%ProgramFiles%\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" 2>nul
          if errorlevel 1 exit /b 1
          mkdir dist 2>nul
          cl /nologo /std:c++20 /EHsc /O2 /MD /I"_rdr2sdk\RDR2_Menu_Base\inc" rdr2_build\trainer.cpp /link /DLL /OUT:dist\RDR2UltimateTrainer.asi /LIBPATH:"_rdr2sdk\RDR2_Menu_Base\lib" ScriptHookRDR2.lib user32.lib

      - name: Verify ASI
        shell: pwsh
        run: |
          if (!(Test-Path "dist/RDR2UltimateTrainer.asi")) { throw "ASI was not created" }
          Get-Item "dist/RDR2UltimateTrainer.asi" | Format-List Name,Length,LastWriteTime

      - name: Add install notes
        shell: pwsh
        run: |
          @'
          RDR2 ULTIMATE TRAINER - TEST BUILD

          Story Mode only.

          Install RDR2UltimateTrainer.asi into the same folder as RDR2.exe.
          You also need the official ScriptHookRDR2.dll and dinput8.dll from:
          https://www.dev-c.com/scripthookrdr2/

          Controls:
          F5 = open/close trainer
          Arrow keys or numpad = navigate
          Enter or numpad 5 = select
          Backspace or numpad 0 = close

          Current test features:
          God Mode
          Invisible
          No Ragdoll
          Heal Player
          Teleport Forward 20m

          Do not use in Red Dead Online.
          '@ | Set-Content -Path "dist/INSTALL.txt"

      - name: Upload trainer
        uses: actions/upload-artifact@v4
        with:
          name: RDR2UltimateTrainer
          path: dist/*
          if-no-files-found: error
